<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>麦门签筒 · 摇一根薯条，定今天中午吃什么</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --red:#DA291C; --red-deep:#A8140A; --red-dark:#7d1208;
    --gold:#FFC72C; --ink:#1b1712; --ink2:#6b625a; --ink3:#9a9188;
    --paper:#faf6ef; --line:#e8dfd2;
  }
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:0 20px 56px;overflow-x:hidden;
  }
  .topline{position:fixed;top:0;left:0;right:0;height:4px;background:var(--red)}
  header{text-align:center;padding:38px 0 0;max-width:520px;width:100%}
  .eyebrow{font-size:11px;letter-spacing:.3em;color:var(--red);font-weight:600;margin-bottom:14px}
  h1{font-size:34px;letter-spacing:.1em;margin:0;font-weight:700;text-indent:.1em}
  .tagline{font-size:13px;color:var(--ink2);line-height:1.9;margin:14px 0 0}
  .tagline b{color:var(--ink);font-weight:600}
  .citybar{display:flex;align-items:center;justify-content:center;gap:10px;margin:20px 0 0;font-size:12px;color:var(--ink3)}
  .pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;padding:4px 11px;background:#fff}
  .pill .sq{width:5px;height:5px;background:var(--red);border-radius:1px}
  select{font-family:inherit;font-size:12px;color:var(--ink);border:none;background:transparent;outline:none;cursor:pointer;padding:0}

  .stage{position:relative;width:100%;max-width:520px;min-height:470px;
         display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:26px}
  .floor{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);
         width:250px;height:26px;background:radial-gradient(ellipse at center,rgba(60,35,10,.16),transparent 68%);
         filter:blur(2px);pointer-events:none}

  .carton{position:relative;width:196px;height:200px;cursor:pointer;
          transform-origin:50% 100%;filter:drop-shadow(0 16px 18px rgba(80,30,10,.18));
          -webkit-user-select:none;user-select:none}
  .carton-back{position:absolute;bottom:0;left:0;width:196px;height:200px;
    background:linear-gradient(105deg,#8e150b,#b81f10 45%,#8e150b);
    clip-path:polygon(0 0,100% 0,84% 100%,16% 100%)}
  .carton-front{position:absolute;bottom:0;left:0;width:196px;height:186px;
    background:linear-gradient(100deg,#c22214 0%,#DA291C 26%,#e8331f 52%,#c81f12 84%,#a81a0e 100%);
    clip-path:polygon(0 0,100% 0,84% 100%,16% 100%);
    display:flex;flex-direction:column;align-items:center}
  .carton-front:after{content:"";position:absolute;top:0;left:0;width:100%;height:14px;
    background:linear-gradient(rgba(0,0,0,.22),transparent)}
  .mlogo{margin-top:44px;width:96px;height:64px}
  .ff{margin-top:2px;color:#ffe9b0;font-size:10px;letter-spacing:.32em;font-weight:600;text-indent:.32em}
  .cn{margin-top:auto;margin-bottom:26px;color:#ffd9a0;font-size:12px;letter-spacing:.42em;text-indent:.42em;
      font-family:"Songti SC","STSong",serif;opacity:.85}

  .fries{position:absolute;bottom:172px;left:0;width:196px;height:130px;z-index:2;pointer-events:none}
  .fry{position:absolute;bottom:0;width:9px;border-radius:3px 3px 1px 1px;
       background:linear-gradient(90deg,#c8901f 0%,#f2c248 26%,#ffe08a 55%,#f7d061 78%,#d79c25 100%);
       box-shadow:inset 0 -6px 6px rgba(160,100,20,.25),inset 0 3px 2px rgba(255,240,200,.6);
       transform-origin:50% 100%}
  .fry:before{content:"";position:absolute;top:0;left:0;width:100%;height:9px;
       background:linear-gradient(rgba(150,95,20,.35),transparent);border-radius:3px 3px 0 0}

  .carton.shake{animation:rock .72s cubic-bezier(.36,.07,.19,.97)}
  @keyframes rock{
    0%,100%{transform:rotate(0) translateX(0)}
    12%{transform:rotate(-8deg) translateX(-12px)}
    30%{transform:rotate(7deg) translateX(11px)}
    48%{transform:rotate(-6deg) translateX(-9px)}
    66%{transform:rotate(4deg) translateX(6px)}
    84%{transform:rotate(-2deg) translateX(-3px)}
  }
  .carton.shake .fry{animation:jiggle .72s ease-in-out;animation-delay:calc(var(--i) * 9ms)}
  @keyframes jiggle{
    0%,100%{transform:rotate(var(--r)) translateY(0)}
    25%{transform:rotate(calc(var(--r) + 5deg)) translateY(-9px)}
    55%{transform:rotate(calc(var(--r) - 4deg)) translateY(-3px)}
    80%{transform:rotate(calc(var(--r) + 2deg)) translateY(-5px)}
  }

  .flyer{position:absolute;width:12px;height:104px;border-radius:4px;z-index:20;pointer-events:none;
    background:linear-gradient(90deg,#c8901f,#f2c248 30%,#ffe08a 58%,#d79c25);
    box-shadow:inset 0 -6px 6px rgba(160,100,20,.25),0 10px 16px -6px rgba(90,60,10,.4);
    transform-origin:50% 50%;opacity:0}

  .hint{margin-top:22px;font-size:12.5px;color:var(--ink2);text-align:center;line-height:2;min-height:44px}
  .hint em{font-style:normal;color:var(--red);font-weight:600}
  .cast{
    margin-top:6px;font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.18em;text-indent:.18em;
    color:#fff;background:var(--red);border:none;border-radius:26px;padding:14px 44px;cursor:pointer;
    box-shadow:0 8px 20px -8px rgba(218,41,28,.7);transition:transform .12s,box-shadow .2s}
  .cast:hover{box-shadow:0 10px 26px -8px rgba(218,41,28,.8)}
  .cast:active{transform:scale(.96)}
  .cast:disabled{opacity:.45;cursor:default;box-shadow:none}
  .micro{font-size:11px;color:var(--ink3);margin-top:14px;letter-spacing:.04em}

  .result{width:100%;max-width:520px;display:none}
  .result.show{display:block;animation:rise .45s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 26px 24px;
        box-shadow:0 24px 50px -30px rgba(80,50,20,.35);position:relative;overflow:hidden}
  .card:before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--red)}
  .card-top{display:flex;align-items:center;justify-content:space-between}
  .no{font-size:11px;letter-spacing:.2em;color:var(--ink3);font-variant-numeric:tabular-nums}
  .seal{background:var(--red);color:#fff8ea;font-size:12px;font-weight:600;letter-spacing:.2em;text-indent:.2em;
        padding:5px 12px 4px;border-radius:3px;transform:rotate(-3deg);
        animation:stamp .4s cubic-bezier(.2,1.5,.4,1) both .15s}
  @keyframes stamp{from{transform:rotate(-12deg) scale(1.9);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
  .hex{font-size:30px;font-weight:700;letter-spacing:.12em;margin:20px 0 6px;text-align:center;text-indent:.12em}
  .hexsub{text-align:center;font-size:11px;letter-spacing:.24em;color:var(--ink3)}
  .poem{margin:24px 0 0;text-align:center;font-size:17px;line-height:2.4;letter-spacing:.12em;
        font-family:"Songti SC","STSong","SimSun",serif;color:#2a2119}
  .poem div{opacity:0;animation:fadein .5s ease forwards}
  .poem div:nth-child(1){animation-delay:.3s}.poem div:nth-child(2){animation-delay:.42s}
  .poem div:nth-child(3){animation-delay:.54s}.poem div:nth-child(4){animation-delay:.66s}
  @keyframes fadein{to{opacity:1}}
  .rule{height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 10px);margin:24px 0 18px}
  .dish-h{font-size:10.5px;letter-spacing:.28em;color:var(--red);font-weight:600;margin-bottom:12px}
  .dish{display:flex;align-items:baseline;gap:10px;padding:9px 0;font-size:14px;border-bottom:1px solid #f4eee4}
  .dish .lb{flex:0 0 34px;font-size:11px;color:var(--ink3)}
  .dish .nm{flex:1;color:var(--ink)}
  .dish .pr{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px}
  .sum{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px}
  .sum span{font-size:12px;letter-spacing:.2em;color:var(--ink2)}
  .sum b{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .aside{margin-top:22px;padding:14px 16px;background:#fff8e8;border-left:3px solid var(--gold);
         border-radius:0 8px 8px 0;font-size:12px;line-height:1.9;color:var(--ink2)}
  .aside b{color:var(--ink);font-weight:600}
  .aside .tag{display:block;font-size:10px;letter-spacing:.26em;color:#b8912f;font-weight:600;margin-bottom:6px}
  .again{display:block;margin:24px auto 0;font-family:inherit;font-size:13px;letter-spacing:.16em;text-indent:.16em;
    color:var(--red);background:transparent;border:1px solid var(--red);border-radius:22px;padding:11px 30px;cursor:pointer}
  .again:hover{background:rgba(218,41,28,.05)}

  footer{max-width:520px;width:100%;margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
         font-size:10.5px;line-height:1.95;color:var(--ink3);text-align:center}
  footer b{color:var(--ink2)}
  @media (max-width:400px){
    h1{font-size:28px}
    .card{padding:24px 20px 20px}
    .poem{font-size:16px}
  }
</style>
</head>
<body>
<div class="topline"></div>

<header>
  <div class="eyebrow">MAI MEN QIAN TONG</div>
  <h1>麦门签筒</h1>
  <p class="tagline">摇一根薯条，今天吃什么都由它定。<br>签是随机的，<b>签上那顿饭的价钱是真的</b>。</p>
  <div class="citybar">
    <span class="pill"><span class="sq"></span><span id="slotTag">正签</span></span>
    <span class="pill"><select id="city"></select></span>
    <span id="storeName" style="font-size:11px"></span>
  </div>
</header>

<div class="stage" id="stage">
  <div class="floor"></div>
  <div class="carton" id="carton" role="button" tabindex="0" aria-label="摇一摇薯条盒">
    <div class="fries" id="fries"></div>
    <div class="carton-back"></div>
    <div class="carton-front">
      <svg class="mlogo" viewBox="0 0 120 76" aria-hidden="true">
        <path d="M14 66 V30 Q14 12 30 12 Q46 12 46 30 V66" fill="none" stroke="#FFC72C" stroke-width="12"/>
        <path d="M74 66 V30 Q74 12 90 12 Q106 12 106 30 V66" fill="none" stroke="#FFC72C" stroke-width="12"/>
      </svg>
      <div class="ff">FRENCH FRIES</div>
      <div class="cn">麥門簽</div>
    </div>
  </div>
  <div class="hint" id="hint">点击盒子，或按住鼠标<em>快速左右摇</em><br>也可以直接点下面这根</div>
  <button class="cast" id="cast">摇 一 根</button>
  <div class="micro">手机端可以真的摇一摇</div>
</div>

<div class="result" id="result"></div>

<footer>
  <b>娱乐声明</b>：本签为随机游戏，不具任何预测功能，不构成饮食、消费或健康建议。<br>
  菜单与价格来自麦当劳中国官方 MCP（mcp.mcd.cn）实时查询，采集于 <span id="genAt">—</span>，以门店实际为准。<br>
  签诗为原创文案，与麦当劳无关。
</footer>

<script src="data.js"></script>
<script>
(function(){
  const SIGNS = window.SIGNS, MENUS = window.MENUS;
  const MU = ["零","一","二","三","四","五","六","七","八","九","十"];
  const CN = n => n<=10 ? MU[n] : (n<20 ? "十"+MU[n-10] : (n%10===0 ? MU[Math.floor(n/10)]+"十" : MU[Math.floor(n/10)]+"十"+MU[n%10]));
  const GRADES = [
    {max:.15, name:"上上", word:"最丰"},
    {max:.40, name:"上吉", word:"有肉"},
    {max:.70, name:"中平", word:"主常"},
    {max:.90, name:"中下", word:"从简"},
    {max:1.01,name:"下下", word:"最简"}
  ];

  let current = null, busy = false;

  function pick(items, keys){
    for(const k of keys){
      let h = items.find(i => i.name === k);
      if(h) return h;
      h = items.find(i => i.name.indexOf(k) >= 0);
      if(h) return h;
    }
    return null;
  }

  function buildFor(city){
    const rec = MENUS[city];
    if(!rec) return null;
    const now = new Date();
    const isMorning = now.getHours() < 10 || (now.getHours() === 10 && now.getMinutes() < 30);
    let slot = isMorning && (rec.slots.morning||[]).length >= 6 ? "morning" : "main";
    let items = rec.slots[slot] || [];
    if(items.length < 6){ slot = "main"; items = rec.slots.main || []; }
    if(!items.length) return null;

    const built = [];
    for(const s of (SIGNS[slot] || [])){
      const got = [];
      let ok = true;
      for(const [key,label] of [["main","主食"],["side","小食"],["drink","饮品"]]){
        const keys = s[key] || [];
        if(!keys.length) continue;
        const hit = pick(items, keys);
        if(!hit){ ok = false; break; }
        got.push({label, name:hit.name, price:hit.price});
      }
      if(!ok || !got.length) continue;
      built.push({sign:s, items:got, total:+got.reduce((a,b)=>a+b.price,0).toFixed(1)});
    }
    if(built.length < 5) return null;

    const W = {"主食":2.0,"小食":1.0,"饮品":0.6};
    built.forEach(b=>{ b.score = +b.items.reduce((a,i)=>a+(W[i.label]||0),0).toFixed(2); });
    const sorted = built.slice().sort((a,b)=> b.score-a.score || b.total-a.total);
    sorted.forEach((b,i)=>{
      b.grade = GRADES.find(g => (i+1)/sorted.length <= g.max) || GRADES[4];
      b.rank = i+1;
    });
    return {city, slot, storeName:rec.storeName, signs:sorted, count:sorted.length};
  }

  function aside(st, res){
    const out = [];
    const cityBm = (MENUS[st.city].slots.main||[]).find(i => i.name === "巨无霸");
    const totals = st.signs.map(x=>x.total).sort((a,b)=>a-b);
    const med = totals[Math.floor(totals.length/2)];
    const n = res.items.length;

    if(res.rank === 1) out.push("这是本店 <b>"+st.count+"</b> 支签里最丰盛的一支："+n+" 样东西，合计 <b>"+res.total.toFixed(1)+"</b> 元。");
    else if(res.rank === st.count) out.push("这是本店 <b>"+st.count+"</b> 支签里最简的一支，只有 "+n+" 样。想吃饱的人抽到它，算是一种考验。");
    else out.push("你这一签 "+n+" 样东西，合计 <b>"+res.total.toFixed(1)+"</b> 元；本店 "+st.count+" 支签的合计价中位数是 <b>"+med.toFixed(1)+"</b> 元，你比中位"+(res.total>med?"贵":"省")+" <b>"+Math.abs(res.total-med).toFixed(1)+"</b> 元。");

    if(cityBm){
      const p = cityBm.price;
      const lhasa = (MENUS["拉萨市"] && (MENUS["拉萨市"].slots.main||[]).find(i=>i.name==="巨无霸"));
      let t = "巨无霸在"+st.city.replace("市","")+"卖 <b>"+p.toFixed(1)+"</b> 元";
      if(lhasa && st.city !== "拉萨市") t += "，比拉萨的 "+lhasa.price.toFixed(1)+" 元便宜 <b>"+(lhasa.price-p).toFixed(1)+"</b> 元";
      else if(st.city === "拉萨市") t += "，是全国最贵的一档（170 家门店里 50.6% 都卖 26.5 元）";
      out.push(t + "。");
    }
    return out.join("<br>");
  }

  function drawFries(){
    const box = document.getElementById("fries");
    box.innerHTML = "";
    const N = 24;
    for(let i=0;i<N;i++){
      const f = document.createElement("div");
      f.className = "fry";
      f.style.width = (8 + ((i*17)%3)) + "px";
      f.style.height = (62 + ((i*41)%58)) + "px";
      f.style.left = (16 + i*6.6 + ((i*29)%5)) + "px";
      const r = ((i*53)%100)/100*14 - 7;
      f.style.setProperty("--r", r+"deg");
      f.style.setProperty("--i", i);
      f.style.transform = "rotate("+r+"deg)";
      f.style.zIndex = (i%3);
      box.appendChild(f);
    }
  }

  function renderChoices(){
    const sel = document.getElementById("city");
    sel.innerHTML = "";
    Object.keys(MENUS).forEach(c=>{
      const o = document.createElement("option");
      o.value = c; o.textContent = c.replace("市","");
      sel.appendChild(o);
    });
    const prefer = ["杭州市","上海市","北京市"].find(c=>MENUS[c]);
    if(prefer) sel.value = prefer;
  }

  function loadCity(){
    current = buildFor(document.getElementById("city").value);
    const tag = document.getElementById("slotTag");
    const sn = document.getElementById("storeName");
    const btn = document.getElementById("cast");
    if(!current){
      tag.textContent = "无签"; sn.textContent = ""; btn.disabled = true;
      document.getElementById("hint").innerHTML = "这家门店此刻的菜单不足，换一座城试试";
      return;
    }
    btn.disabled = false;
    tag.textContent = current.slot === "morning" ? "早签" : "正签";
    sn.textContent = (current.storeName||"").replace("麦当劳","").slice(0,12);
  }

  function flyFry(done){
    const stage = document.getElementById("stage");
    const carton = document.getElementById("carton");
    const sr = stage.getBoundingClientRect(), cr = carton.getBoundingClientRect();
    const f = document.createElement("div");
    f.className = "flyer";
    const startX = cr.left - sr.left + cr.width/2 - 6;
    const startY = cr.top - sr.top - 66;
    f.style.left = startX+"px";
    f.style.top = startY+"px";
    f.style.opacity = "1";
    stage.appendChild(f);
    const dx = 108, dy = cr.height + 66 - 26;
    const anim = f.animate([
      {transform:"translate(0,0) rotate(0deg) scale(1)",opacity:1,offset:0},
      {transform:`translate(${dx*0.42}px,${-150}px) rotate(140deg) scale(1.04)`,opacity:1,offset:.42},
      {transform:`translate(${dx}px,${dy}px) rotate(238deg) scale(1)`,opacity:1,offset:.86},
      {transform:`translate(${dx}px,${dy}px) rotate(262deg) scale(1)`,opacity:1,offset:1}
    ],{duration:900,easing:"cubic-bezier(.25,.6,.35,1)",fill:"forwards"});
    anim.onfinish = ()=>{ setTimeout(()=>{ f.remove(); done(); }, 260); };
  }

  function cast(){
    if(!current || busy) return;
    busy = true;
    const btn = document.getElementById("cast");
    const carton = document.getElementById("carton");
    const hint = document.getElementById("hint");
    btn.disabled = true;
    carton.classList.remove("shake");
    void carton.offsetWidth;
    carton.classList.add("shake");
    hint.innerHTML = "薯条晃动中……";

    setTimeout(()=>{
      carton.classList.remove("shake");
      flyFry(()=>{
        const pool = current.signs;
        showResult(pool[Math.floor(Math.random()*pool.length)]);
        btn.disabled = false; busy = false;
        hint.innerHTML = "点击盒子，或按住鼠标<em>快速左右摇</em>";
      });
    }, 620);
  }

  function showResult(res){
    const st = current, s = res.sign;
    const el = document.getElementById("result");
    el.innerHTML = `
      <div class="card">
        <div class="card-top">
          <span class="no">第 ${CN(s.no)} 签 / ${st.slot==="morning"?"早":"正"}签</span>
          <span class="seal">${res.grade.name}</span>
        </div>
        <div class="hex">${s.hex}</div>
        <div class="hexsub">${s.mood}　·　${res.grade.word}</div>
        <div class="poem">${s.poem.map(l=>`<div>${l}</div>`).join("")}</div>
        <div class="rule"></div>
        <div class="dish-h">应 签 之 餐</div>
        ${res.items.map(i=>`<div class="dish"><span class="lb">${i.label}</span><span class="nm">${i.name}</span><span class="pr">¥${i.price.toFixed(1)}</span></div>`).join("")}
        <div class="sum"><span>合 计</span><b>¥${res.total.toFixed(1)}</b></div>
        <div class="aside"><span class="tag">签 外 话</span>${aside(st,res)}</div>
        <button class="again" id="again">再摇一根</button>
      </div>`;
    el.classList.add("show");
    document.getElementById("again").onclick = ()=>{
      el.classList.remove("show"); el.innerHTML = "";
      document.getElementById("hint").innerHTML = "心念不变的话，签可能会重复<br>想换口味就先换个念头";
      window.scrollTo({top:0,behavior:"smooth"});
    };
    setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"start"}),120);
  }

  let lastX = null, lastT = 0, lastDir = 0, swings = 0, swingReset = null;
  document.getElementById("stage").addEventListener("mousemove", e=>{
    if(busy) return;
    const now = performance.now();
    if(lastX === null){ lastX = e.clientX; lastT = now; return; }
    const dt = Math.max(1, now-lastT), dx = e.clientX-lastX;
    const v = Math.abs(dx)/dt*1000;
    if(v > 620){
      const dir = Math.sign(dx);
      if(lastDir && dir !== lastDir){
        swings++;
        clearTimeout(swingReset);
        swingReset = setTimeout(()=>{ swings = 0; }, 700);
        if(swings >= 2){ swings = 0; cast(); }
      }
      lastDir = dir;
    }
    lastX = e.clientX; lastT = now;
  });

  let lastShake = 0;
  window.addEventListener("devicemotion", e=>{
    const a = e.accelerationIncludingGravity;
    if(!a) return;
    const m = Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0);
    if(m > 34 && Date.now()-lastShake > 1800){
      lastShake = Date.now();
      if(!busy) cast();
    }
  });

  document.addEventListener("DOMContentLoaded", ()=>{
    drawFries(); renderChoices(); loadCity();
    document.getElementById("cast").onclick = cast;
    const carton = document.getElementById("carton");
    carton.onclick = cast;
    carton.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); cast(); } };
    document.getElementById("city").onchange = ()=>{
      document.getElementById("result").classList.remove("show");
      document.getElementById("result").innerHTML = "";
      loadCity();
    };
    document.getElementById("genAt").textContent = (window.META||{}).genAt || "—";
  });
})();
</script>
</body>
</html>

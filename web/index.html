<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="麦门签：选择早餐、午餐或晚餐，摇出一份含主食、配餐与替换项的随机点餐食帖。">
<meta name="theme-color" content="#da291c">
<meta property="og:title" content="麦门签 · 今天吃什么？">
<meta property="og:description" content="三根薯条，一卦定一餐。选择早餐、午餐或晚餐，摇出一个明确答案。">
<meta property="og:type" content="website">
<title>麦门签 · 今天吃什么？</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23da291c'/%3E%3Cpath d='M15 48V31c0-12 15-12 17 0 2-12 17-12 17 0v17' fill='none' stroke='%23ffc72c' stroke-width='7'/%3E%3C/svg%3E">
<style>
  :root{
    --red:#da291c;
    --red-deep:#ae190f;
    --red-dark:#74160f;
    --gold:#ffc72c;
    --gold-deep:#f0b21c;
    --cream:#f6f0e5;
    --paper:#fffdf8;
    --ink:#231e19;
    --muted:#786f65;
    --soft:#eee6d8;
    --line:#ded4c4;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --serif:"Songti SC","STSong","SimSun",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    margin:0;min-height:100vh;background:var(--cream);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  button{font:inherit;color:inherit}
  button:focus-visible{outline:3px solid var(--gold-deep);outline-offset:4px}
  [hidden]{display:none!important}
  .site-head{
    max-width:1120px;margin:0 auto;padding:24px 28px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer}
  .brand-mark{width:31px;height:31px;border-radius:8px;background:var(--red);display:grid;place-items:center;flex:0 0 auto}
  .brand-mark svg{width:23px;height:18px;display:block}
  .brand-word{font-size:15px;font-weight:750;letter-spacing:.12em}
  .brand-sub{font-size:9px;letter-spacing:.2em;color:var(--muted);margin-top:1px}
  .head-actions{display:flex;align-items:center;gap:10px}
  .mode-chip{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:7px 12px;background:var(--paper)}
  .back-home{background:none;border:0;padding:6px 2px;font-size:12px;color:var(--red);font-weight:650;cursor:pointer}
  .back-home:hover{text-decoration:underline;text-underline-offset:4px}

  .landing{max-width:980px;margin:0 auto;padding:42px 28px 64px;text-align:center}
  .landing h1{
    font-size:clamp(42px,7vw,66px);line-height:1.08;letter-spacing:-.055em;
    margin:0;font-weight:800;
  }
  .landing h1 span{color:var(--red)}
  .mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:38px}
  .mode-card{
    position:relative;display:flex;min-height:172px;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    text-align:center;background:var(--paper);border:1px solid var(--line);
    border-radius:18px;padding:22px;cursor:pointer;overflow:hidden;
    transition:transform .18s ease,border-color .18s ease,background .18s ease;
  }
  .mode-card:before{content:"";position:absolute;left:0;top:0;width:100%;height:5px;background:var(--gold)}
  .mode-card[data-meal-title="午餐"]:before{background:var(--red)}
  .mode-card:hover{transform:translateY(-4px);border-color:#b8aa97;background:#fff}
  .mode-card:active{transform:translateY(-1px)}
  .meal-icon{display:block;width:54px;height:54px;flex:0 0 auto}
  .mode-card h2{font-size:22px;line-height:1.2;margin:0;letter-spacing:-.025em;font-weight:800}

  .ritual{max-width:980px;margin:0 auto;padding:8px 28px 58px}
  .ritual-head{text-align:center;margin:8px auto 4px;max-width:620px}
  .ritual-eyebrow{font-size:11px;letter-spacing:.2em;font-weight:750;color:var(--red);margin:0 0 10px}
  .ritual-head h2{font-size:clamp(31px,4.4vw,46px);letter-spacing:-.05em;margin:0;font-weight:800}
  .hint{font-size:12.5px;line-height:1.85;color:var(--muted);margin:12px 0 0;min-height:23px}
  .stage{
    position:relative;display:grid;grid-template-columns:280px 270px;gap:56px;
    align-items:center;justify-content:center;min-height:365px;margin:2px auto 0;
    touch-action:manipulation;
  }
  .gua-board{
    position:relative;width:100%;max-width:280px;height:218px;justify-self:end;
    background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  }
  .gua-board:before{content:"";position:absolute;left:16px;top:16px;width:8px;height:8px;border-radius:2px;background:var(--gold)}
  .board-label{position:absolute;right:16px;top:15px;font-size:9px;letter-spacing:.18em;color:#a39889;font-weight:650}
  .ghost-lines{
    position:absolute;left:24px;right:24px;top:46px;bottom:60px;
    display:flex;flex-direction:column;justify-content:space-between;transition:opacity .25s ease;
  }
  .ghost-row{height:14px;display:flex;justify-content:center;gap:16px}
  .ghost-row i{display:block;height:14px;border-radius:4px;background:#ece3d4}
  .ghost-row i.full{width:100%}
  .ghost-row i.half{width:42%}
  .filled .ghost-lines{opacity:0}
  .pieces{position:absolute;left:24px;right:24px;top:46px;bottom:60px}
  .piece{position:absolute;height:14px;border-radius:5px;background:var(--gold);opacity:0}
  .piece.alt{background:var(--gold-deep)}
  .gua-caption{
    position:absolute;left:20px;right:20px;bottom:15px;display:flex;align-items:baseline;
    justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:11px;
  }
  .gua-caption b{font-size:16px;letter-spacing:.04em;font-weight:750;min-width:70px}
  .gua-caption span{font-size:11px;color:var(--muted);text-align:right;line-height:1.4}
  .gua-board.landed .gua-caption b{color:var(--red)}
  .gua-board.landed .gua-caption{animation:capIn .38s ease both}
  @keyframes capIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .carton{
    position:relative;display:block;width:260px;height:auto;aspect-ratio:260/354;
    padding:0;border:0;background:transparent;cursor:pointer;justify-self:start;
    transform-origin:50% 92%;user-select:none;
  }
  .carton-back,.carton-front{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  .carton-back{z-index:1}
  .carton-front{z-index:3}
  .fries-layer{position:absolute;z-index:2;left:5%;right:5%;top:0;height:68%}
  .fry{position:absolute;bottom:0;border-radius:3px;transform-origin:50% 100%;background:var(--gold)}
  .fry.alt{background:var(--gold-deep)}
  .carton-face{
    position:absolute;z-index:4;inset:0;display:flex;flex-direction:column;align-items:center;
    padding-top:85%;pointer-events:none;color:#fff5df;
  }
  .mlogo{display:block;width:28%;height:auto;margin-bottom:3%}
  .carton-name{font-size:clamp(14px,2.7vw,17px);line-height:1.3;font-weight:700;letter-spacing:.15em;text-indent:.15em;color:#fff3d2}
  .carton-question{margin-top:5px;font-size:clamp(12px,2.3vw,14px);letter-spacing:.08em;text-indent:.08em;color:#fff3d2}
  .carton.shake{animation:rock .66s cubic-bezier(.36,.07,.19,.97)}
  @keyframes rock{
    0%,100%{transform:rotate(0) translateX(0)}
    12%{transform:rotate(-7deg) translateX(-11px)}
    30%{transform:rotate(6deg) translateX(10px)}
    48%{transform:rotate(-5deg) translateX(-8px)}
    66%{transform:rotate(3deg) translateX(5px)}
    84%{transform:rotate(-1.4deg) translateX(-2px)}
  }
  .carton.shake .fry{animation:jiggle .66s ease-in-out;animation-delay:calc(var(--i) * 8ms)}
  @keyframes jiggle{
    0%,100%{transform:rotate(var(--r)) translateY(0)}
    28%{transform:rotate(calc(var(--r) + 5deg)) translateY(-8px)}
    56%{transform:rotate(calc(var(--r) - 4deg)) translateY(-2px)}
    80%{transform:rotate(calc(var(--r) + 2deg)) translateY(-5px)}
  }

  .cast-row{text-align:center;margin-top:6px}
  .has-result .cast-row{display:none}
  .cast{
    border:0;border-radius:999px;background:var(--red);color:#fff;cursor:pointer;
    padding:15px 46px;font-size:13px;font-weight:750;letter-spacing:.17em;text-indent:.17em;
    transition:background .16s,transform .12s;
  }
  .cast:hover{background:var(--red-deep)}
  .cast:active{transform:scale(.975)}
  .cast:disabled{background:#b9ab9b;cursor:default}
  .micro{font-size:10.5px;color:#958b7f;letter-spacing:.02em;margin:12px 0 0}

  .result{max-width:680px;margin:36px auto 0;scroll-margin-top:24px}
  .result.show{animation:rise .42s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .result-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .result-head{display:flex;align-items:center;gap:18px;padding:22px 24px;border-bottom:1px solid var(--line)}
  .gua-seal{
    flex:0 0 auto;width:66px;height:66px;display:grid;place-items:center;background:var(--red);
    color:var(--gold);border-radius:12px;font-family:var(--serif);font-size:38px;line-height:1;
  }
  .result-heading{flex:1;min-width:0}
  .result-kicker{font-size:10px;letter-spacing:.16em;color:var(--muted);margin:0 0 5px;font-weight:700}
  .result-title{font-size:22px;letter-spacing:-.025em;margin:0;font-weight:800;line-height:1.25}
  .result-title span{color:var(--red);margin-left:5px;font-size:13px;font-weight:600}
  .taste{
    flex:0 0 auto;background:var(--gold);color:#4e3000;border-radius:5px;
    padding:7px 10px;font-size:11px;font-weight:800;white-space:nowrap;letter-spacing:.05em;
  }
  .result-line{padding:17px 24px 0;font-family:var(--serif);font-size:14px;color:var(--muted);line-height:1.7}
  .meal-panel{margin:16px 24px 0;padding:24px 24px 20px;background:var(--cream);border-radius:12px}
  .meal-label{font-size:10px;letter-spacing:.2em;color:var(--red);font-weight:800;margin:0 0 10px}
  .meal-main{font-size:clamp(27px,4vw,36px);line-height:1.24;letter-spacing:-.04em;font-weight:800;margin:0}
  .meal-pair{margin:8px 0 0;font-size:15px;line-height:1.6;color:#574d42}
  .meal-availability{margin:12px 0 0;font-size:11px;line-height:1.6;color:var(--muted)}
  .meal-fallback{margin:17px 0 0;padding-top:13px;border-top:1px dashed #d9cebd;font-size:11.5px;line-height:1.7;color:#8a7f71}
  .meal-fallback b{color:var(--red);font-weight:700}
  .result-note{padding:14px 24px 0;font-size:10.5px;line-height:1.65;color:#958a7d}
  .result-actions{display:flex;gap:10px;padding:19px 24px 24px}
  .action{border-radius:999px;padding:12px 22px;font-size:12px;font-weight:700;cursor:pointer;transition:background .16s,color .16s}
  .action.primary{flex:1;background:var(--red);color:#fff;border:1px solid var(--red)}
  .action.primary:hover{background:var(--red-deep);border-color:var(--red-deep)}
  .action.secondary{background:transparent;color:var(--red);border:1px solid var(--red)}
  .action.secondary:hover{background:#fbebe7}

  footer{max-width:980px;margin:30px auto 0;padding:16px 28px 32px;border-top:1px solid var(--line);color:#948a7d;font-size:10.5px;line-height:1.8;text-align:center}
  footer b{color:var(--muted);font-weight:650}
  footer a{color:var(--red);text-decoration:none;border-bottom:1px solid rgba(218,41,28,.35)}
  footer a:hover{border-bottom-color:var(--red)}
  .footer-line{margin:0}
  .menu-source{margin:8px auto 0;max-width:620px;text-align:left}
  .menu-source summary{width:max-content;margin:0 auto;color:var(--muted);cursor:pointer}
  .menu-source p{margin:5px 0 0}
  .toast{
    position:fixed;z-index:50;left:50%;bottom:28px;transform:translate(-50%,16px);
    background:var(--ink);color:#fff8eb;border-radius:8px;padding:11px 17px;font-size:12px;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media(max-width:760px){
    .site-head{padding:18px 18px}
    .brand-sub{display:none}
    .landing{padding:32px 18px 42px}
    .landing h1{font-size:clamp(40px,11vw,58px)}
    .mode-grid{grid-template-columns:1fr;gap:10px;margin-top:28px}
    .mode-card{min-height:76px;flex-direction:row;justify-content:flex-start;gap:14px;padding:12px 18px;border-radius:15px}
    .mode-card:before{left:0;top:0;width:5px;height:100%}
    .meal-icon{width:42px;height:42px}
    .mode-card h2{font-size:20px}
    .ritual{padding:4px 18px 42px}
    .stage{grid-template-columns:1fr;gap:9px;min-height:0;margin-top:8px}
    .gua-board{width:min(76vw,260px);height:168px;justify-self:center;order:1}
    .gua-board:before{left:13px;top:13px}
    .board-label{top:12px;right:13px}
    .ghost-lines{left:20px;right:20px;top:37px;bottom:54px}
    .pieces{left:20px;right:20px;top:37px;bottom:54px}
    .gua-caption{left:16px;right:16px;bottom:11px;padding-top:9px}
    .gua-caption b{font-size:14px;min-width:60px}
    .gua-caption span{font-size:10px}
    .carton{width:212px;justify-self:center;order:2}
    .carton-face{padding-top:85%}
    .mlogo{width:28%;margin-bottom:3%}
    .carton-name{font-size:13px}
    .carton-question{font-size:11px}
    .hint{font-size:11.5px}
    .cast-row{margin-top:2px}
    .cast{padding:14px 38px}
    .micro{font-size:10px}
    .result{margin-top:24px}
    .result-head{padding:17px 17px;gap:12px}
    .gua-seal{width:52px;height:52px;font-size:30px;border-radius:9px}
    .result-title{font-size:18px}
    .result-title span{display:block;margin:3px 0 0;font-size:11px}
    .taste{font-size:10px;padding:6px 7px}
    .result-line{padding:14px 17px 0;font-size:12.5px}
    .meal-panel{margin:13px 17px 0;padding:19px 17px 17px}
    .meal-main{font-size:27px}
    .meal-pair{font-size:13px}
    .meal-fallback{font-size:10.5px}
    .result-note{padding:12px 17px 0;font-size:10px}
    .result-actions{padding:15px 17px 18px}
    .action{padding:11px 14px;font-size:11px}
    footer{margin-top:18px;padding:14px 18px 26px;font-size:10px}
  }
  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto} *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>
<header class="site-head">
  <button class="brand" id="brandBtn" type="button" aria-label="回到麦门签首页">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 132 104"><path d="M22 96V52C22 18 66 18 66 52V96V52C66 18 110 18 110 52V96" fill="none" stroke="#ffc72c" stroke-width="15" stroke-linecap="butt" stroke-linejoin="round"/></svg>
    </span>
    <span><span class="brand-word">麦门签</span><br><span class="brand-sub">一卦定一餐</span></span>
  </button>
  <div class="head-actions">
    <span class="mode-chip" id="headMode" hidden>早签 · 早餐</span>
    <button class="back-home" id="backHome" type="button" hidden>换一顿</button>
  </div>
</header>

<main>
  <section class="landing" id="landing">
    <h1>今天<span>吃哪顿？</span></h1>
    <div class="mode-grid">
      <button class="mode-card" type="button" data-mode="breakfast" data-meal-title="早餐" aria-label="选择早餐">
        <svg class="meal-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <path d="M12 43h40M20 42a12 12 0 0 1 24 0M32 11v8M14 21l6 6m30-6-6 6" fill="none" stroke="#da291c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M25 42a7 7 0 0 1 14 0" fill="none" stroke="#ffc72c" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <h2>早餐</h2>
      </button>
      <button class="mode-card" type="button" data-mode="all_day" data-meal-title="午餐" aria-label="选择午餐">
        <svg class="meal-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <circle cx="32" cy="32" r="14" fill="#ffc72c" stroke="#da291c" stroke-width="3"/>
          <path d="M32 7v6M32 51v6M7 32h6m38 0h6M14.3 14.3l4.2 4.2m27 27 4.2 4.2m0-35.4-4.2 4.2m-27 27-4.2 4.2" fill="none" stroke="#da291c" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <h2>午餐</h2>
      </button>
      <button class="mode-card" type="button" data-mode="all_day" data-meal-title="晚餐" aria-label="选择晚餐">
        <svg class="meal-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <path d="M42 9a23 23 0 1 0 13 41A25 25 0 0 1 42 9Z" fill="#ffc72c" stroke="#da291c" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="17" cy="17" r="2.5" fill="#da291c"/><circle cx="13" cy="31" r="2" fill="#da291c"/>
        </svg>
        <h2>晚餐</h2>
      </button>
    </div>
  </section>

  <section class="ritual" id="ritual" hidden>
    <div class="ritual-head">
      <p class="ritual-eyebrow" id="ritualEyebrow">早签 · 早餐</p>
      <h2>摇三根，落一卦。</h2>
      <p class="hint" id="hint">点击薯条盒，或快速左右移动鼠标。</p>
    </div>
    <div class="stage" id="stage">
      <div class="gua-board" id="guaBoard" aria-label="卦象区">
        <span class="board-label">今 日 卦 象</span>
        <div class="ghost-lines" aria-hidden="true">
          <div class="ghost-row"><i class="full"></i></div>
          <div class="ghost-row"><i class="half"></i><i class="half"></i></div>
          <div class="ghost-row"><i class="full"></i></div>
        </div>
        <div class="pieces" id="pieces" aria-hidden="true"></div>
        <div class="gua-caption"><b id="guaName">签未落</b><span id="guaImage">摇一摇，让薯条说话</span></div>
      </div>
      <button class="carton" id="carton" type="button" aria-label="摇一摇薯条盒">
        <div class="fries-layer" id="fries" aria-hidden="true"></div>
        <svg class="carton-back" viewBox="0 0 260 354" aria-hidden="true">
          <path d="M19 145Q130 219 241 145L218 338Q130 350 42 338Z" fill="#9b1a11"/>
        </svg>
        <svg class="carton-front" viewBox="0 0 260 354" aria-hidden="true">
          <path d="M17 155Q130 230 243 155L209 344Q130 336 51 344Z" fill="#da291c"/>
        </svg>
        <div class="carton-face" aria-hidden="true">
          <svg class="mlogo" viewBox="0 0 132 104"><path d="M22 96V52C22 18 66 18 66 52V96V52C66 18 110 18 110 52V96" fill="none" stroke="#ffc72c" stroke-width="15" stroke-linecap="butt" stroke-linejoin="round"/></svg>
          <div class="carton-name">麦门签：</div>
          <div class="carton-question">今天吃什么？</div>
        </div>
      </button>
    </div>
    <div class="cast-row">
      <button class="cast" id="cast" type="button">摇 一 签</button>
      <p class="micro">点一下薯条盒，看看今天吃什么</p>
    </div>
  </section>

  <section class="result" id="result" hidden aria-live="polite"></section>
</main>

<footer>
  <p class="footer-line"><b>随机点餐，仅供娱乐</b>；餐品供应以门店实际菜单为准。</p>
  <p class="footer-line">本作品为参赛创意，非麦当劳官方产品。 · <a href="https://github.com/Dovesoup/maimen-qiantong" target="_blank" rel="noopener">在 GitHub 看源码</a></p>
  <details class="menu-source">
    <summary>菜单来源说明</summary>
    <p>菜单锚点核对自麦当劳中国官方 MCP 查询结果（2026-10-22）。本页不保证各门店全时段供应。</p>
  </details>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

"锡兰红茶"],"fallback":{"main":"麦香鸡","companions":["薯条","锡兰红茶"]}}},{"id":"kan","symbol":"☵","name":"坎","image":"水润·浓郁","taste":"浓郁","line":"水气丰足，浓郁一点。","breakfast":{"main":"猪柳蛋麦满分","companions":["脆薯饼","鲜萃咖啡"],"fallback":{"main":"猪柳麦满分","companions":["脆薯饼","鲜萃咖啡"]}},"all_day":{"main":"双层吉士汉堡","companions":["麦辣鸡翅","可乐"],"fallback":{"main":"巨无霸","companions":["麦辣鸡翅","可乐"]},"variants":[{"main":"培根安格斯厚牛堡","companions":["麦辣鸡翅","可乐"],"fallback":{"main":"双层吉士汉堡","companions":["麦辣鸡翅","可乐"]},"availabilityNote":"部分门店供应，缺货时按下方食帖替换。","sampleCoverage":{"matchingStores":9,"sampleStores":11,"snapshotDate":"2026-10-22"}}]}},{"id":"gen","symbol":"☶","name":"艮","image":"山止·慢吃","taste":"慢吃","line":"山不赶路，一口一口。","breakfast":{"main":"火腿扒麦满分","companions":["玉米杯","纯牛奶(盒装)"],"fallback":{"main":"吉士蛋麦满分","companions":["玉米杯","纯牛奶(盒装)"]}},"all_day":{"main":"麦乐鸡","companions":["玉米杯","纯牛奶(盒装)"],"fallback":{"main":"麦辣鸡翅","companions":["玉米杯","纯牛奶(盒装)"]}}},{"id":"kun","symbol":"☷","name":"坤","image":"地载·当令","taste":"当令","line":"地载时令，今天吃鸡。","breakfast":{"main":"当季鸡肉早餐新品（请店员选一个）","companions":["脆薯饼","优品豆浆"],"fallback":{"main":"原味板烧鸡腿炒双蛋堡","companions":["脆薯饼","优品豆浆"]}},"all_day":{"main":"当季鸡肉新品主食（请店员选一个）","companions":["玉米杯","锡兰红茶"],"fallback":{"main":"麦香鸡","companions":["玉米杯","锡兰红茶"]}}}]};
</script>
<script>
(function(){
  'use strict';
  const DATA = window.GUA_DATA;
  if(!DATA || !Array.isArray(DATA.gua)) return;

  const LINES = {
    qian:[1,1,1], dui:[0,1,1], li:[1,0,1], zhen:[0,0,1],
    xun:[1,1,0], kan:[0,1,0], gen:[1,0,0], kun:[0,0,0]
  };
  const MODE = {
    breakfast:{label:'早签', title:'早餐'},
    all_day:{label:'正餐签', title:'午晚'}
  };
  const $ = id => document.getElementById(id);
  const refs = {
    landing:$('landing'), ritual:$('ritual'), result:$('result'), stage:$('stage'),
    board:$('guaBoard'), pieces:$('pieces'), guaName:$('guaName'), guaImage:$('guaImage'),
    carton:$('carton'), fries:$('fries'), cast:$('cast'), hint:$('hint'),
    headMode:$('headMode'), backHome:$('backHome'), ritualEyebrow:$('ritualEyebrow'), toast:$('toast')
  };
  const state = { mode:null, mealTitle:null, busy:false, last:null, run:0 };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function mealModeText(){
    const title=state.mealTitle||MODE[state.mode].title;
    return `${MODE[state.mode].label} · ${title}`;
  }

  function makeFries(){
    const colors = ['', ' alt'];
    for(let i=0;i<12;i++){
      const el=document.createElement('i');
      const w=7.3 + (i%3)*0.35;
      const h=[74,92,84,100,80,96,68,90,77,94,86,71][i];
      const left=14 + i*6;
      const rot=(i-5.5)*2.2;
      el.className='fry'+colors[i%colors.length];
      el.style.cssText=`left:${left}%;width:${w}%;height:${h}%;transform:rotate(${rot}deg);--r:${rot}deg;--i:${i}`;
      refs.fries.appendChild(el);
    }
  }

  function setMode(mode, fromEntry, mealTitle){
    state.run++; state.busy=false;
    refs.carton.classList.remove('shake');
    state.mode=mode;
    state.mealTitle=mealTitle||MODE[mode].title;
    refs.landing.hidden=true;
    refs.ritual.hidden=false;
    refs.result.hidden=true;
    refs.headMode.hidden=false;
    refs.backHome.hidden=false;
    refs.headMode.textContent=mealModeText();
    refs.ritualEyebrow.textContent=mealModeText();
    refs.hint.textContent='点击薯条盒，或快速左右移动鼠标。';
    refs.cast.disabled=false;
    refs.cast.textContent='摇 一 签';
    resetBoard();
    if(fromEntry) window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});
  }

  function resetBoard(){
    refs.pieces.innerHTML='';
    refs.board.classList.remove('filled','landed');
    refs.guaName.textContent='签未落';
    refs.guaImage.textContent='摇一摇，让薯条说话';
    refs.result.hidden=true;
    refs.result.innerHTML='';
    document.body.classList.remove('has-result');
  }

  function home(){
    state.run++; state.mode=null; state.mealTitle=null; state.busy=false;
    refs.carton.classList.remove('shake');
    refs.landing.hidden=false;
    refs.ritual.hidden=true;
    refs.result.hidden=true;
    refs.headMode.hidden=true;
    refs.backHome.hidden=true;
    resetBoard();
    window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});
  }

  function randomGua(){
    return DATA.gua[Math.floor(Math.random()*DATA.gua.length)];
  }

  function randomMeal(g){
    const base=g[state.mode];
    const options=[base,...(base.variants||[])];
    return options.length===1?base:options[Math.floor(Math.random()*options.length)];
  }

  function wait(ms){return new Promise(r=>setTimeout(r,ms));}

  function makePiece(x,y,w,delay,alt){
    const el=document.createElement('i');
    el.className='piece'+(alt?' alt':'');
    el.style.left=x+'px'; el.style.top=y+'px'; el.style.width=w+'px';
    refs.pieces.appendChild(el);

    const pr=refs.pieces.getBoundingClientRect();
    const cr=refs.carton.getBoundingClientRect();
    const sourceX=cr.left+cr.width/2-pr.left+(Math.random()-.5)*34;
    const sourceY=cr.top+cr.height*(230/354)-pr.top;
    const dx=sourceX-(x+w/2);
    const dy=sourceY-(y+7);
    const startRot=-90+((Math.random()*12)-6);

    el.style.opacity='0';
    if(reduced){el.style.opacity='1';return Promise.resolve();}
    const anim=el.animate([
      {transform:`translate(${dx}px,${dy}px) rotate(${startRot}deg)`,opacity:0},
      {opacity:1,offset:.14},
      {transform:'translate(0,0) rotate(0deg)',opacity:1}
    ],{duration:560,delay,easing:'cubic-bezier(.18,.82,.3,1)',fill:'both'});
    return anim.finished.then(()=>{el.style.opacity='1';el.style.transform='none';anim.cancel();});
  }

  async function drawGua(g, run){
    refs.board.classList.add('filled');
    const pr=refs.pieces.getBoundingClientRect();
    const rows=LINES[g.id]||[1,1,1];
    const rowH=pr.height/3;
    const long=Math.min(pr.width*.7,152);
    const gap=16;
    const short=(long-gap)/2;
    const tasks=[];
    let order=0;
    for(let row=2;row>=0;row--){
      const y=rowH*(row+.5)-7;
      if(rows[row]){
        const x=(pr.width-long)/2;
        tasks.push(makePiece(x,y,long,order*105,false));
        order++;
      }else{
        const x=(pr.width-long)/2;
        tasks.push(makePiece(x,y,short,order*105,false));
        tasks.push(makePiece(x+short+gap,y,short,order*105+55,true));
        order++;
      }
    }
    await Promise.all(tasks);
    if(run!==state.run) return;
    refs.board.classList.add('landed');
    refs.guaName.textContent=g.symbol+'  '+g.name;
    refs.guaImage.textContent=g.image;
    await wait(reduced?0:150);
  }

  function mealHtml(m){
    return `<p class="meal-label">今日食帖</p>
      <h3 class="meal-main">${m.main}</h3>
      <p class="meal-pair">${m.companions.join(' · ')}</p>
      ${m.availabilityNote?`<p class="meal-availability">${m.availabilityNote}</p>`:''}
      <p class="meal-fallback"><b>若无此味，整份换：</b>${m.fallback.main} · ${m.fallback.companions.join(' · ')}</p>`;
  }

  function showResult(g,m){
    refs.result.innerHTML=`<div class="result-card">
      <div class="result-head">
        <div class="gua-seal" aria-hidden="true">${g.symbol}</div>
        <div class="result-heading">
          <p class="result-kicker">${mealModeText()}</p>
          <h3 class="result-title">${g.name}<span>${g.image}</span></h3>
        </div>
        <span class="taste">口味 · ${g.taste}</span>
      </div>
      <p class="result-line">${g.line}</p>
      <div class="meal-panel">${mealHtml(m)}</div>
      <p class="result-note">门店缺货时，按食帖下方的替换方案点餐。</p>
      <div class="result-actions">
        <button class="action primary" id="shareBtn" type="button">分享这一签</button>
        <button class="action secondary" id="againBtn" type="button">再摇一签</button>
      </div>
    </div>`;
    refs.result.hidden=false;
    document.body.classList.add('has-result');
    refs.result.classList.remove('show');
    void refs.result.offsetWidth;
    refs.result.classList.add('show');
    $('shareBtn').addEventListener('click',()=>share(g,m));
    $('againBtn').addEventListener('click',()=>{if(state.busy)return;resetBoard();cast();});
    const run=state.run;
    setTimeout(()=>{if(run===state.run && !refs.result.hidden) refs.result.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});},100);
  }

  async function cast(){
    if(!state.mode || state.busy) return;
    state.busy=true;
    const run=++state.run;
    resetBoard();
    refs.cast.disabled=true;
    refs.cast.textContent='摇 签 中…';
    refs.hint.textContent='签在筒里响。等三根薯条落定。';
    refs.carton.classList.remove('shake');
    void refs.carton.offsetWidth;
    refs.carton.classList.add('shake');
    if(navigator.vibrate) navigator.vibrate([28,40,28]);
    await wait(reduced?40:660);
    if(run!==state.run) return;
    refs.carton.classList.remove('shake');
    const g=randomGua();
    const m=randomMeal(g);
    state.last=g;
    await drawGua(g, run);
    if(run!==state.run) return;
    showResult(g,m);
    refs.cast.disabled=false;
    refs.cast.textContent='再 摇 一 签';
    refs.hint.textContent='一卦已定。往下看这一顿。';
    state.busy=false;
  }

  async function copyText(text){
    try{await navigator.clipboard.writeText(text);return true;}
    catch(e){
      try{
        const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';
        document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();return ok;
      }catch(_){return false;}
    }
  }

  function toast(msg){
    refs.toast.textContent=msg;refs.toast.classList.add('show');
    clearTimeout(toast.t);toast.t=setTimeout(()=>refs.toast.classList.remove('show'),2200);
  }

  async function share(g,m){
    const url=location.origin+location.pathname;
    const text=`我在麦门签摇到「${g.name}·${g.image}」：${m.main}，配 ${m.companions.join('、')}。今天你吃哪一卦？`;
    if(navigator.share){
      try{await navigator.share({title:'麦门签 · 今天吃什么？',text,url});return;}catch(e){if(e && e.name==='AbortError')return;}
    }
    const ok=await copyText(`${text}\n${url}`);
    toast(ok?'文案已复制，去发给那个也选不出来的人':'复制失败，请手动复制地址');
  }

  document.querySelectorAll('.mode-card').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode,true,b.dataset.mealTitle)));
  refs.carton.addEventListener('click',cast);
  refs.cast.addEventListener('click',cast);
  $('brandBtn').addEventListener('click',home);
  refs.backHome.addEventListener('click',home);

  let lastX=null,lastT=0,dir=0,reversals=0,firstReverse=0,lastMove=0;
  refs.stage.addEventListener('mousemove',e=>{
    if(!state.mode||state.busy||!refs.result.hidden) return;
    const now=performance.now();
    if(now-lastMove>700){lastX=e.clientX;reversals=0;dir=0;lastMove=now;return;}
    lastMove=now;
    if(lastX===null){lastX=e.clientX;lastT=now;return;}
    const dx=e.clientX-lastX;
    const dt=Math.max(1,now-lastT);
    const speed=Math.abs(dx)/dt*1000;
    if(Math.abs(dx)>=3 && speed>520){
      const nd=Math.sign(dx);
      if(dir && nd!==dir){
        if(now-firstReverse>850){reversals=1;firstReverse=now;}
        else reversals++;
        if(reversals>=4){reversals=0;cast();}
      }
      dir=nd;
    }
    lastX=e.clientX;lastT=now;
  });
  refs.stage.addEventListener('mouseleave',()=>{lastX=null;dir=0;reversals=0;});

  makeFries();
})();
</script>
</body>
</html>

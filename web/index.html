<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>麦门签筒 · 选择困难症专用</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --paper:#f4ecdd; --paper2:#efe5d2; --ink:#241f1a; --ink2:#5c5348;
    --red:#b02e26; --red2:#8d2119; --gold:#b8873b; --line:#d9cbae;
  }
  html,body{margin:0;height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Songti SC","STSong","SimSun",Georgia,serif;
    display:flex; flex-direction:column; align-items:center;
    overflow-x:hidden; padding:0 18px 40px;
    background-image:radial-gradient(circle at 50% 0%,#faf5e9 0%,var(--paper) 55%,var(--paper2) 100%);
  }
  header{text-align:center;padding:26px 0 6px;width:100%;max-width:520px}
  .title{font-size:30px;letter-spacing:.22em;margin:0;font-weight:600;text-indent:.22em}
  .title small{display:block;font-size:11px;letter-spacing:.34em;color:var(--gold);margin-top:8px;font-weight:400;text-indent:.34em}
  .sub{font-size:12.5px;color:var(--ink2);margin:10px 0 0;line-height:1.8;letter-spacing:.02em}
  .citybar{display:flex;align-items:center;gap:8px;margin:16px 0 0;font-size:13px;color:var(--ink2)}
  select{
    font-family:inherit;font-size:13px;color:var(--ink);background:transparent;
    border:none;border-bottom:1px dashed var(--gold);padding:3px 2px;outline:none;cursor:pointer;
  }
  .dot{width:5px;height:5px;border-radius:50%;background:var(--red);display:inline-block}

  /* ── 签筒 ── */
  .stage{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;
         position:relative;flex:1;justify-content:center;min-height:340px;padding-top:10px}
  .tube{position:relative;width:132px;height:196px;margin-top:56px;transition:transform .12s}
  .tube.shaking{animation:shake .13s linear infinite}
  @keyframes shake{
    0%{transform:rotate(-3.2deg) translateY(0)}
    25%{transform:rotate(2.6deg) translateY(-3px)}
    50%{transform:rotate(-2.4deg) translateY(1px)}
    75%{transform:rotate(3deg) translateY(-2px)}
    100%{transform:rotate(-3.2deg) translateY(0)}
  }
  .body{
    position:absolute;bottom:0;left:0;width:132px;height:150px;
    background:linear-gradient(100deg,#8e5a2f 0%,#b07a44 22%,#c99457 45%,#a06f3c 72%,#7d4f28 100%);
    border-radius:6px 6px 9px 9px;
    box-shadow:inset -8px 0 14px rgba(0,0,0,.18),inset 8px 0 10px rgba(255,255,255,.14),0 10px 22px -8px rgba(70,40,10,.5);
  }
  .body:before{ /* 筒口内阴影 */
    content:"";position:absolute;top:-3px;left:0;width:100%;height:14px;
    background:linear-gradient(#5d3718,#8d5c30);border-radius:50%/70%;
  }
  .body:after{ /* 腰箍 */
    content:"";position:absolute;top:84px;left:-4px;width:140px;height:11px;
    background:linear-gradient(#6d4520,#a9763f,#6d4520);border-radius:3px;
    box-shadow:0 1px 2px rgba(0,0,0,.25);
  }
  .label{
    position:absolute;top:56px;left:0;width:132px;text-align:center;
    font-size:15px;letter-spacing:.3em;color:#ffe7bd;text-indent:.3em;
    text-shadow:0 1px 2px rgba(60,30,0,.6);z-index:3;pointer-events:none;
  }
  .sticks{position:absolute;top:-64px;left:50%;transform:translateX(-50%);width:110px;height:80px;z-index:1}
  .stk{
    position:absolute;bottom:0;width:5px;border-radius:2px 2px 0 0;
    background:linear-gradient(#f7e6c4,#e8cfa3);
    box-shadow:inset -1px 0 1px rgba(150,110,60,.5),0 0 2px rgba(120,80,30,.35);
  }
  .stk i{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--red);opacity:.55}

  /* 飞出的签 */
  .flyer{
    position:absolute;left:50%;top:64px;width:34px;height:136px;
    background:linear-gradient(#fffdf6,#f3e6c8);border-radius:3px;
    box-shadow:0 8px 22px -6px rgba(80,50,20,.5);z-index:9;
    display:flex;align-items:center;justify-content:center;
    transform:translate(-50%,0) scale(.9);opacity:0;
    writing-mode:vertical-rl;font-size:13px;letter-spacing:.24em;color:var(--red2);
    border-top:3px solid var(--red);
  }
  .flyer.out{animation:fly .72s cubic-bezier(.2,.9,.25,1) forwards}
  @keyframes fly{
    0%{transform:translate(-50%,0) scale(.9) rotate(0);opacity:0}
    18%{opacity:1;transform:translate(-50%,-56px) scale(1) rotate(-6deg)}
    70%{transform:translate(-50%,-70px) scale(1) rotate(4deg)}
    100%{transform:translate(-50%,-58px) scale(.96) rotate(-2deg);opacity:1}
  }

  .hint{font-size:12.5px;color:var(--ink2);letter-spacing:.1em;margin-top:36px;text-align:center;line-height:1.9}
  .btn{
    font-family:inherit;font-size:15px;letter-spacing:.2em;text-indent:.2em;
    color:#fff8ea;background:var(--red);border:none;border-radius:2px;
    padding:14px 42px;cursor:pointer;margin-top:16px;
    box-shadow:0 6px 18px -8px var(--red2),inset 0 0 0 1px rgba(255,255,255,.14);
    transition:transform .12s,background .2s;
  }
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--red);box-shadow:none;border:1px solid var(--red);padding:11px 26px;font-size:13px}

  /* ── 结果 ── */
  .result{
    width:100%;max-width:520px;display:none;padding:8px 0 0;
  }
  .result.show{display:block;animation:rise .5s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .card{
    background:linear-gradient(#fffdf7,#faf3e3);border:1px solid var(--line);
    border-radius:3px;padding:26px 22px 22px;position:relative;
    box-shadow:0 18px 40px -24px rgba(80,50,20,.55);
  }
  .card:before,.card:after{
    content:"";position:absolute;left:14px;right:14px;height:1px;background:var(--line);
  }
  .card:before{top:10px}.card:after{bottom:10px}
  .no{font-size:12px;color:var(--ink2);letter-spacing:.2em;text-align:center}
  .hex{font-size:27px;letter-spacing:.16em;text-align:center;margin:10px 0 4px;text-indent:.16em}
  .hexsub{text-align:center;font-size:11.5px;letter-spacing:.22em;color:var(--ink2);margin-top:8px}
  .seal{
    display:inline-block;margin:10px auto 0;padding:6px 12px 5px;
    background:var(--red);color:#fff4e2;font-size:14px;letter-spacing:.24em;text-indent:.24em;
    border-radius:2px;transform:rotate(-3deg);
    box-shadow:0 2px 0 var(--red2);
    animation:stamp .42s cubic-bezier(.2,1.4,.4,1) both .18s;
  }
  @keyframes stamp{from{transform:rotate(-14deg) scale(2.1);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
  .sealwrap{text-align:center}
  .poem{margin:22px 0 4px;text-align:center;font-size:16.5px;line-height:2.35;letter-spacing:.1em;color:#33291f}
  .poem div{opacity:0;animation:fadein .5s ease forwards}
  .poem div:nth-child(1){animation-delay:.30s}
  .poem div:nth-child(2){animation-delay:.40s}
  .poem div:nth-child(3){animation-delay:.50s}
  .poem div:nth-child(4){animation-delay:.60s}
  @keyframes fadein{to{opacity:1}}
  .rule{height:1px;background:var(--line);margin:22px 0 16px}
  .dish-h{font-size:11.5px;letter-spacing:.24em;color:var(--gold);margin-bottom:10px}
  .dish{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;font-size:14.5px;border-bottom:1px dotted var(--line)}
  .dish span:first-child{color:var(--ink2);font-size:12px;letter-spacing:.1em;min-width:46px}
  .dish span:last-child{font-variant-numeric:tabular-nums;color:var(--ink)}
  .sum{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:15px}
  .sum b{font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .aside{
    margin-top:20px;padding:13px 15px;background:rgba(184,135,59,.09);
    border-left:2px solid var(--gold);font-size:12.5px;line-height:1.85;color:var(--ink2);
  }
  .aside b{color:var(--ink);font-weight:600}
  .aside .tag{font-size:10.5px;letter-spacing:.2em;color:var(--gold);display:block;margin-bottom:4px}
  .acts{display:flex;gap:10px;justify-content:center;margin-top:22px}
  footer{width:100%;max-width:520px;margin-top:34px;font-size:11px;line-height:1.9;color:#8d8477;text-align:center;border-top:1px solid var(--line);padding-top:14px}
  footer b{color:#6d6459}
  .empty{padding:40px 0;text-align:center;font-size:13px;color:var(--ink2);line-height:2}
</style>
</head>
<body>

<header>
  <h1 class="title">麦门签筒<small>MAI MEN QIAN TONG</small></h1>
  <p class="sub">摇一支签，今日吃什么都由它定。<br>签是随机的，签上的价钱是真的。</p>
  <div class="citybar">
    <span class="dot"></span>
    <span id="slotTag">正签</span>
    <select id="city"></select>
    <span id="storeName" style="font-size:11.5px;opacity:.7"></span>
  </div>
</header>

<div class="stage" id="stage">
  <div class="tube" id="tube">
    <div class="sticks" id="sticks"></div>
    <div class="body"></div>
    <div class="label">麥門簽</div>
  </div>
  <div class="flyer" id="flyer"></div>
  <p class="hint" id="hint">双手合十，心念今天想吃什么<br>然后摇一摇</p>
  <button class="btn" id="cast">摇 一 签</button>
</div>

<div class="result" id="result"></div>

<footer>
  <b>娱乐声明</b>：本签为随机游戏，不具任何预测功能，不构成饮食、消费或健康建议。<br>
  菜单与价格来自麦当劳中国官方 MCP（mcp.mcd.cn）实时查询，采集于 <span id="genAt">—</span>，以门店实际为准。<br>
  签诗为原创文案，与麦当劳无关。
</footer>

<script src="data.js"></script>
<script>
(function(){
  const SIGNS = window.SIGNS, MENUS = window.MENUS;
  const MU = ["零","一","二","三","四","五","六","七","八","九","十"];
  const CN = n => n<=10 ? MU[n] : (n<20 ? "十"+MU[n-10] : (n%10===0 ? MU[Math.floor(n/10)]+"十" : MU[Math.floor(n/10)]+"十"+MU[n%10]));

  // 签等：按合计价在本店全部可出签中的分位，便宜=上上
  // 签等按「这一签的规格」排：三件为上上，一杯水为下下。与吉凶无关。
  const GRADES = [
    {max:.15, name:"上上", word:"最丰"},
    {max:.40, name:"上吉", word:"有肉"},
    {max:.70, name:"中平", word:"主常"},
    {max:.90, name:"中下", word:"从简"},
    {max:1.01,name:"下下", word:"最简"}
  ];

  let current = null; // {city, slot, signs:[{sign, items, total, grade}]}

  function pick(items, keys){
    for(const k of keys){
      let h = items.find(i => i.name === k);
      if(h) return h;
      h = items.find(i => i.name.indexOf(k) >= 0);
      if(h) return h;
    }
    return null;
  }

  function buildFor(city){
    const rec = MENUS[city];
    if(!rec) return null;
    const now = new Date();
    const isMorning = now.getHours() < 10 || (now.getHours() === 10 && now.getMinutes() < 30);
    let slot = isMorning && (rec.slots.morning||[]).length >= 6 ? "morning" : "main";
    let items = rec.slots[slot] || [];
    if(items.length < 6){ slot = "main"; items = rec.slots.main || []; }
    if(!items.length) return null;

    const pool = SIGNS[slot] || [];
    const built = [];
    for(const s of pool){
      const got = [];
      let ok = true;
      for(const [key, label] of [["main","主食"],["side","小食"],["drink","饮品"]]){
        const keys = s[key] || [];
        if(!keys.length) continue;
        const hit = pick(items, keys);
        if(!hit){ ok = false; break; }
        got.push({label, name:hit.name, price:hit.price});
      }
      if(!ok || !got.length) continue;
      built.push({sign:s, items:got, total:+got.reduce((a,b)=>a+b.price,0).toFixed(1)});
    }
    if(built.length < 5) return null;

    // 签等：先看这一签的规格（主食>小食>饮品），同规格按真实合计价排序
    const W = {"主食":2.0, "小食":1.0, "饮品":0.6};
    built.forEach(b=>{ b.score = +b.items.reduce((a,i)=>a+(W[i.label]||0),0).toFixed(2); });
    const sorted = built.slice().sort((a,b)=> b.score-a.score || b.total-a.total);
    sorted.forEach((b,i)=>{
      const q = (i+1)/sorted.length;
      b.grade = GRADES.find(g => q <= g.max) || GRADES[4];
      b.rank = i+1;
    });
    return {city, slot, storeName:rec.storeName, signs:sorted, count:sorted.length};
  }

  // ── 签外话：把真实价格数据接进解签
  function aside(st, res){
    const s = res.sign;
    const out = [];
    const cityBm = (MENUS[st.city].slots.main||[]).find(i => i.name === "巨无霸");
    const totals = st.signs.map(x=>x.total).sort((a,b)=>a-b);
    const med = totals[Math.floor(totals.length/2)];
    const dishes = res.items.length;

    if(res.rank === 1) out.push("这是本店 <b>"+st.count+"</b> 支签里最丰盛的一支："+dishes+" 样东西，合计 <b>"+res.total.toFixed(1)+"</b> 元。");
    else if(res.rank === st.count) out.push("这是本店 <b>"+st.count+"</b> 支签里最简的一支，只有 "+dishes+" 样。想吃饱的人抽到它，算是一种考验。");
    else out.push("你这一签 "+dishes+" 样东西，合计 <b>"+res.total.toFixed(1)+"</b> 元；本店 "+st.count+" 支签的合计价中位数是 <b>"+med.toFixed(1)+"</b> 元，你比中位"+(res.total>med?"贵":"省")+" <b>"+Math.abs(res.total-med).toFixed(1)+"</b> 元。");

    if(cityBm){
      const p = cityBm.price;
      const lhasa = (MENUS["拉萨市"] && (MENUS["拉萨市"].slots.main||[]).find(i=>i.name==="巨无霸"));
      let t = "巨无霸在"+st.city.replace("市","")+"卖 <b>"+p.toFixed(1)+"</b> 元";
      if(lhasa && st.city !== "拉萨市"){
        t += "，比拉萨的 "+lhasa.price.toFixed(1)+" 元便宜 <b>"+(lhasa.price-p).toFixed(1)+"</b> 元";
      }else if(st.city === "拉萨市"){
        t += "，是全国最贵的一档（170 家门店里 50.6% 都卖 26.5 元）";
      }
      t += "。";
      out.push(t);
    }
    return out.join("<br>");
  }

  // ── 渲染签支
  function drawSticks(n){
    const box = document.getElementById("sticks");
    box.innerHTML = "";
    for(let i=0;i<36;i++){
      const d = document.createElement("div");
      d.className = "stk";
      const h = 44 + ((i*37)%34);
      d.style.height = h+"px";
      d.style.left = (3 + (i*2.9)) + "px";
      d.style.bottom = ((i*13)%9) + "px";
      d.style.transform = "rotate("+(((i*53)%100)/100*7-3.5)+"deg)";
      box.appendChild(d);
    }
  }

  function renderChoices(){
    const sel = document.getElementById("city");
    sel.innerHTML = "";
    Object.keys(MENUS).forEach(c=>{
      const o = document.createElement("option");
      o.value = c; o.textContent = c.replace("市","");
      sel.appendChild(o);
    });
    // 默认优先杭州，其次上海
    const prefer = ["杭州市","上海市","北京市"].find(c=>MENUS[c]);
    if(prefer) sel.value = prefer;
  }

  function loadCity(){
    const city = document.getElementById("city").value;
    current = buildFor(city);
    const tag = document.getElementById("slotTag");
    const sn = document.getElementById("storeName");
    if(!current){
      tag.textContent = "无签";
      sn.textContent = "";
      document.getElementById("cast").disabled = true;
      document.getElementById("hint").innerHTML = "这家门店此刻的菜单不足，换一座城试试";
      return;
    }
    document.getElementById("cast").disabled = false;
    tag.textContent = current.slot === "morning" ? "早签" : "正签";
    sn.textContent = (current.storeName||"").replace("麦当劳","").slice(0,14);
    document.getElementById("hint").innerHTML = "双手合十，心念今天想吃什么<br>然后摇一摇";
  }

  function cast(){
    if(!current) return;
    const btn = document.getElementById("cast");
    btn.disabled = true;
    const tube = document.getElementById("tube");
    const flyer = document.getElementById("flyer");
    const hint = document.getElementById("hint");
    flyer.className = "flyer";
    tube.classList.add("shaking");
    hint.textContent = "签筒摇动中……";

    let n = 0;
    const iv = setInterval(()=>{ n++; if(n>9) clearInterval(iv); }, 60);

    setTimeout(()=>{
      tube.classList.remove("shaking");
      const pool = current.signs;
      const hit = pool[Math.floor(Math.random()*pool.length)];
      flyer.textContent = "第"+CN(hit.sign.no)+"签";
      flyer.classList.add("out");
      hint.textContent = "";
      setTimeout(()=>{ showResult(hit); btn.disabled = false; }, 520);
    }, 620);
  }

  function showResult(res){
    const st = current, s = res.sign;
    const el = document.getElementById("result");
    el.innerHTML = `
      <div class="card">
        <div class="no">第 ${CN(s.no)} 签 · ${st.slot==="morning"?"早":"正"}签</div>
        <div class="hex">${s.hex}</div>
        <div class="hexsub">${s.mood}　·　${res.grade.word}</div>
        <div class="sealwrap"><span class="seal">${res.grade.name}</span></div>
        <div class="poem">${s.poem.map(l=>`<div>${l}</div>`).join("")}</div>
        <div class="rule"></div>
        <div class="dish-h">应 签 之 餐</div>
        ${res.items.map(i=>`<div class="dish"><span>${i.label}</span><span>${i.name}</span><span>¥${i.price.toFixed(1)}</span></div>`).join("")}
        <div class="sum"><span>合 计</span><b>¥${res.total.toFixed(1)}</b></div>
        <div class="aside"><span class="tag">签 外 话</span>${aside(st,res)}</div>
        <div class="acts">
          <button class="btn ghost" id="again">再摇一支</button>
        </div>
      </div>`;
    el.classList.add("show");
    document.getElementById("stage").style.minHeight = "0";
    document.getElementById("again").onclick = ()=>{
      el.classList.remove("show");
      el.innerHTML = "";
      document.getElementById("stage").style.minHeight = "340px";
      document.getElementById("hint").innerHTML = "心念不变的话，签可能会重复<br>想换口味就先换个念头";
      document.getElementById("flyer").className = "flyer";
      window.scrollTo({top:0,behavior:"smooth"});
    };
    setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"start"}),120);
  }

  // 摇一摇（移动端）
  let lastShake = 0;
  window.addEventListener("devicemotion", e=>{
    const a = e.accelerationIncludingGravity;
    if(!a) return;
    const m = Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0);
    if(m > 34 && Date.now()-lastShake > 1600){
      lastShake = Date.now();
      if(!document.getElementById("cast").disabled && !document.getElementById("result").classList.contains("show")) cast();
    }
  });

  document.addEventListener("DOMContentLoaded", ()=>{
    drawSticks();
    renderChoices();
    loadCity();
    document.getElementById("city").onchange = ()=>{
      document.getElementById("result").classList.remove("show");
      document.getElementById("result").innerHTML="";
      loadCity();
    };
    document.getElementById("cast").onclick = cast;
    document.getElementById("genAt").textContent = (window.META||{}).genAt || "—";
  });
})();
</script>
</body>
</html>
